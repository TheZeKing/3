name  :  premier workflow 

on:
  pull_request:
    branches:
      -main
  workflow_dispatch:
jobs:
  hello: 
    runs-on: ubuntu-latest
    steps:
      - name: recuperer le depot 
        uses: actions/checkout@v4

      - name: executer un script
        run: bash scripts/hello.sh

      - name: terminer le workflow
        run: |
          echo "workflow terminé"
      - name:  test secret
        env:
          ip: ${{ secrets.ip }}
        run: ssh "$ip" "echo 'test secret'"